<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký sự kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-start: #7c3aed;
            --brand-end: #4f46e5;
        }
        body {
            background: #f4f4fb;
        }
        .navbar-brand-custom {
            background: linear-gradient(90deg, var(--brand-start), var(--brand-end));
            padding: 1rem 2rem;
            color: white;
        }
        .navbar-brand-custom .brand {
            font-weight: 700;
            font-size: 1.4rem;
        }
        .form-card {
            max-width: 500px;
            margin: 3rem auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .btn-brand {
            background: linear-gradient(90deg, var(--brand-start), var(--brand-end));
            color: white;
            border: none;
        }
        .btn-brand:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body>

<div class="navbar-brand-custom d-flex justify-content-between align-items-center">
    <a href="{{ url_for('register') }}" class="brand text-white text-decoration-none">🎟️ EventGo</a>
</div>

<div class="form-card">
    <h1 class="mb-4 h3">Đăng ký tham gia sự kiện</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-info">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" name="phone" class="form-control">
        </div>
        <button type="submit" class="btn btn-brand w-100">Đăng ký</button>
    </form>
</div>

</body>
</html>
